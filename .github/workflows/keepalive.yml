# GitHub disables scheduled workflows after 60 days without repository activity.
# This job pushes an empty commit to main when the last commit is older than 45 days.
name: keepalive

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Empty commit if main is older than 45 days
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit on main is ${age_days} days old"
          if [ "$age_days" -lt 45 ]; then exit 0; fi
          git config user.name "lime-collector[bot]"
          git config user.email "lime-collector@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: keep scheduled collection enabled"
          git push origin HEAD:main
